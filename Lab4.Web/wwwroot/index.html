<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>ЛР 4 — ONNX модель</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 680px; margin: 40px auto; padding: 0 16px; color: #222; }
    textarea { width: 100%; height: 110px; font: inherit; padding: 8px; box-sizing: border-box; }
    button { margin-top: 10px; padding: 8px 18px; font: inherit; cursor: pointer; }
    #result { margin-top: 20px; padding: 14px; border-radius: 6px; display: none; }
    .bad { background: #fde8e8; border: 1px solid #f5a3a3; }
    .ok { background: #e6f6ea; border: 1px solid #94d3a2; }
    small { color: #666; }
  </style>
</head>
<body>
  <h2>Аналіз твіту на ознаки депресії</h2>
  <small>Модель SdcaLogisticRegression, імпортована з ONNX, обслуговується через PredictionEnginePool</small>
  <p><textarea id="text" placeholder="Введіть текст англійською...">I feel so empty and hopeless, nothing matters anymore</textarea></p>
  <button id="go">Передбачити</button>
  <div id="result"></div>

  <script>
    document.getElementById('go').onclick = async () => {
      const text = document.getElementById('text').value;
      const res = await fetch('/api/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const box = document.getElementById('result');
      box.style.display = 'block';
      if (!res.ok) { box.className = 'bad'; box.textContent = 'Помилка: ' + res.status; return; }
      const r = await res.json();
      box.className = r.depression ? 'bad' : 'ok';
      box.innerHTML = `<b>${r.depression ? 'Є ознаки депресії' : 'Ознак депресії не виявлено'}</b><br>` +
        `Ймовірність: ${(r.probability * 100).toFixed(1)}%<br>Score: ${r.score.toFixed(3)}`;
    };
  </script>
</body>
</html>
